<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .bg { fill: #0a0a0a; }
      .bone { fill: #f5f5f5; }
      .cord { fill: none; stroke: #f5f5f5; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" class="bg"/>

  <!-- Spinal Cord Line -->
  <path d="M 256 120 Q 256 256 256 392" class="cord"/>

  <!-- Vertebrae -->
  <!-- Top -->
  <rect x="228" y="104" width="56" height="28" rx="14" class="bone"/>
  <!-- Upper-Mid -->
  <rect x="220" y="164" width="72" height="32" rx="16" class="bone"/>
  <!-- Center (largest) -->
  <rect x="212" y="228" width="88" height="36" rx="18" class="bone"/>
  <!-- Lower-Mid -->
  <rect x="220" y="296" width="72" height="32" rx="16" class="bone"/>
  <!-- Bottom -->
  <rect x="228" y="360" width="56" height="28" rx="14" class="bone"/>

  <!-- Connection nodes (subtle circles at joints) -->
  <circle cx="256" cy="132" r="6" class="bg"/>
  <circle cx="256" cy="196" r="6" class="bg"/>
  <circle cx="256" cy="264" r="6" class="bg"/>
  <circle cx="256" cy="332" r="6" class="bg"/>
  <circle cx="256" cy="388" r="6" class="bg"/>
</svg>